<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký | DN FOOTBALL</title>
    <link rel="stylesheet" href="../css/auth.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="decor-blob blob-1"></div>
    <div class="decor-blob blob-2"></div>

    <div class="auth-container">
        <a href="index.html" class="back-link">
            <i data-lucide="arrow-left"></i> Quay lại trang chủ
        </a>

        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <i data-lucide="trophy"></i> DN FOOTBALL
                </div>
                <h1>Tạo tài khoản</h1>
                <p>Tham gia cộng đồng bóng đá DN Football.</p>
            </div>

            <form class="auth-form" id="registerForm" novalidate>
                <div id="auth-message" class="auth-message">
                    <i data-lucide="info" class="auth-message-icon"></i>
                    <span class="auth-message-text"></span>
                    <button type="button" class="auth-message-close">
                        <i data-lucide="x"></i>
                    </button>
                </div>
                <div class="form-group">
                    <label for="fullname">Họ tên</label>
                    <div class="input-wrapper">
                        <i data-lucide="user" class="icon-left"></i>
                        <input type="text" id="fullname" class="form-control" placeholder="Nhập họ và tên của bạn" required>
                    </div>
                    <span class="error-text">Vui lòng nhập họ tên</span>
                </div>

                <div class="form-group">
                    <label for="phone">Số điện thoại</label>
                    <div class="input-wrapper">
                        <i data-lucide="phone" class="icon-left"></i>
                        <input type="tel" id="phone" class="form-control" placeholder="Nhập số điện thoại của bạn" required>
                    </div>
                    <span class="error-text">Vui lòng nhập số điện thoại</span>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <i data-lucide="mail" class="icon-left"></i>
                        <input type="email" id="email" class="form-control" placeholder="Nhập email của bạn" required>
                    </div>
                    <span class="error-text">Vui lòng nhập email</span>
                </div>

                <div class="form-group" style="margin-bottom: 24px;">
                    <label for="password">Mật khẩu</label>
                    <div class="input-wrapper">
                        <i data-lucide="lock" class="icon-left"></i>
                        <input type="password" id="password" class="form-control" placeholder="Tạo mật khẩu của bạn" required>
                        <button type="button" class="btn-toggle-password" tabindex="-1">
                            <i data-lucide="eye"></i>
                        </button>
                    </div>
                    <span class="error-text">Vui lòng nhập mật khẩu</span>
                </div>

                <button type="submit" class="btn-primary" data-loading-text="Đang tạo tài khoản...">
                    <span class="btn-text">ĐĂNG KÝ</span>
                </button>
            </form>

            <div class="auth-footer">
                Đã có tài khoản? <a href="login.html">Đăng nhập</a>
            </div>
        </div>
    </div>

    <script src="../js/auth.js"></script>
</body>
</html>
