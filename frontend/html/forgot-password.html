<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu | DN FOOTBALL</title>
    <link rel="stylesheet" href="../css/auth.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="decor-blob blob-1"></div>
    <div class="decor-blob blob-2"></div>

    <div class="auth-container">
        <a href="index.html" class="back-link">
            <i data-lucide="arrow-left"></i> Quay lại trang chủ
        </a>

        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <i data-lucide="trophy"></i> DN FOOTBALL
                </div>
                <h1>Quên mật khẩu?</h1>
            </div>

            <form class="auth-form" id="forgotPasswordForm" novalidate>
    
                <!-- KHỐI 1: Nơi hiển thị thông báo nội bộ -->
                <div class="auth-message">
                    <i data-lucide="info" class="auth-message-icon"></i>
                    <span class="auth-message-text"></span>
                    <button type="button" class="auth-message-close"><i data-lucide="x"></i></button>
                </div>

                <!-- KHỐI 2: BƯỚC 1 - NHẬP EMAIL -->
                <div id="step-1-email">
                    <div class="form-group" style="margin-bottom: 28px;">
                        <label for="email">Email</label>
                        <div class="input-wrapper">
                            <i data-lucide="mail" class="icon-left"></i>
                            <input type="email" id="email" class="form-control" placeholder="Nhập email bạn đã đăng ký" required>
                        </div>
                        <span class="error-text">Vui lòng nhập email</span>
                    </div>

                    <button type="submit" class="btn-primary" data-loading-text="Đang gửi mã...">
                        <span class="btn-text">GỬI YÊU CẦU</span>
                    </button>
                </div>

                <!-- KHỐI 3: BƯỚC 2 - NHẬP OTP & ĐỔI MẬT KHẨU (Ẩn mặc định) -->
                <div id="step-2-reset" style="display: none;">
                    <p class="text-muted" style="font-size: 0.9rem; margin-bottom: 16px;">
                        Mã OTP 6 số đã được gửi. Vui lòng kiểm tra hộp thư (Mã có hiệu lực 5 phút).
                    </p>
                    
                    <div class="form-group">
                        <label for="otp">Mã OTP</label>
                        <div class="input-wrapper">
                            <i data-lucide="key" class="icon-left"></i>
                            <input type="text" id="otp" class="form-control" placeholder="Nhập mã 6 số" maxlength="6">
                        </div>
                        <span class="error-text">Vui lòng nhập mã OTP</span>
                    </div>
                    
                    <div class="form-group" style="margin-bottom: 28px;">
                        <label for="new_password">Mật khẩu mới</label>
                        <div class="input-wrapper">
                            <i data-lucide="lock" class="icon-left"></i>
                            <input type="password" id="new_password" class="form-control" placeholder="Mật khẩu mới (từ 6 ký tự)">
                            <button type="button" class="btn-toggle-password" tabindex="-1"><i data-lucide="eye"></i></button>
                        </div>
                        <span class="error-text">Vui lòng nhập mật khẩu mới</span>
                    </div>

                    <button type="submit" class="btn-primary" data-loading-text="Đang xử lý...">
                        <span class="btn-text">XÁC NHẬN ĐỔI MẬT KHẨU</span>
                    </button>
                </div>
            </form>

            <div class="auth-footer" style="margin-top: 28px;">
                <a href="login.html" style="display: inline-flex; align-items: center; gap: 6px;">
                    <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i> Quay lại đăng nhập
                </a>
            </div>
        </div>
    </div>

    <script src="../js/auth.js"></script>
</body>
</html>
